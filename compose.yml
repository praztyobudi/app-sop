services:
  app-sop:
    build:
      context: .
      dockerfile: dockerfile
    image: app-sop:dev
    container_name: app-sop-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - ../../.env
networks:
  default:
    name: appnet
    external: true